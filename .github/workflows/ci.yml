name: Anchor CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ 'fix/**', 'fix/ci-anchor-tests-rebased' ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev build-essential clang lld llvm-dev libclang-dev

      - name: Install Solana CLI (release tarball)
        run: |
          set -euo pipefail
          SOLANA_VERSION="1.18.25"
          TAR_URL="https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          echo "Downloading solana release tarball $TAR_URL"
          if ! curl -fsSL -o solana.tar.bz2 "$TAR_URL"; then
            echo "curl failed, trying wget"
            wget -qO solana.tar.bz2 "$TAR_URL"
          fi
          mkdir -p "$HOME/.local/share/solana"
          tar -xjf solana.tar.bz2 -C "$HOME/.local/share/solana" --strip-components=1
          echo "$HOME/.local/share/solana/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/bin:$PATH"
          solana --version || true

      - name: Install Anchor CLI
        run: |
          cargo install --locked --force anchor-cli --version 1.1.2 || true
          anchor --version || true

      - name: Install Node deps
        run: |
          npm ci || npm install

      - name: Build Anchor program
        run: |
          export PATH="$HOME/.local/share/solana/bin:$PATH"
          anchor build --skip-lint

      - name: Run Anchor tests (full integration)
        run: |
          export PATH="$HOME/.local/share/solana/bin:$PATH"
          anchor test -- --nocapture 2>&1 | tee /tmp/anchor-test.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-test-logs
          path: |
            ./target
            /tmp/anchor-test.log
            /tmp/solana-validator.log
