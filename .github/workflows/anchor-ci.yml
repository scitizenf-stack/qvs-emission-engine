name: Anchor CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ 'fix/**', 'fix/ci-anchor-tests-rebased' ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev build-essential clang lld llvm-dev libclang-dev

      - name: Install Solana CLI
        run: |
          curl -sSfL https://release.solana.com/v1.18.25/install/solana-install-init.sh | sh -s - v1.18.25
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor CLI
        run: |
          # Install the anchor-cli via cargo for a reproducible, versioned binary
          cargo install --locked --force anchor-cli --version 1.1.2 || true
          anchor --version || true

      - name: Install Node deps
        run: |
          npm ci || npm install

      - name: Build Anchor program
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          anchor build --skip-lint

      - name: Run Anchor tests (full integration)
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          # Capture test output so it can be uploaded on failure
          anchor test -- --nocapture 2>&1 | tee /tmp/anchor-test.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-test-logs
          path: |
            ./target
            /tmp/anchor-test.log
            /tmp/solana-validator.log
