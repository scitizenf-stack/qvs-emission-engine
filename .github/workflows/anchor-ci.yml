name: Anchor CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ fix/ci-anchor-tests ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev build-essential clang lld llvm-dev libclang-dev

      - name: Install Solana CLI
        run: |
          curl -sSfL https://release.solana.com/v1.18.25/install/solana-install-init.sh | sh -s - v1.18.25
          echo "::add-path::$HOME/.local/share/solana/install/active_release/bin"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor CLI (try common packages)
        run: |
          npm install -g @coral-xyz/anchor@1.1.2 || true
          npm install -g @coral-xyz/anchor-cli@1.1.2 || true
          anchor --version || true

      - name: Install Node deps
        run: |
          npm ci || npm install

      - name: Build Anchor program
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          anchor build --skip-lint

      - name: Run Anchor tests (full integration)
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          anchor test -- --nocapture

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-test-logs
          path: |
            ./target
            /tmp/anchor-test.log
            /tmp/solana-validator.log
